# Pipeline de CI: style -> unit -> e2e -> docker
name: ci

on:
  push:
  pull_request:

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Pylint con 88 columnas
        run: >
          python -m pylint app tests --max-line-length=88 --fail-under=10
          --disable=missing-function-docstring,redefined-outer-name,too-few-public-methods

  unit:
    needs: style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Pruebas y BDD con cobertura minima de 80 %
        run: python -m pytest tests --cov=app --cov-fail-under=80

  e2e:
    needs: unit
    runs-on: ubuntu-latest
    env:
      # Clave de ejemplo solo para CI; no es una clave real
      E2E_API_KEY: ci-example-key-0123456789
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium
      - name: Arrancar el producto con el modelo simulado
        env:
          MODEL_PROVIDER: fake
          API_KEYS: ci:${{ env.E2E_API_KEY }}
          RATE_LIMIT_PER_MINUTE: "1000"
        run: |
          python -m uvicorn app.main:app --port 8000 &
          for _ in $(seq 1 40); do
            curl -fs http://127.0.0.1:8000/health && exit 0
            sleep 0.5
          done
          echo "el producto no arranco" && exit 1
      - name: Pruebas de punta a punta
        run: python -m pytest e2e -q --base-url http://127.0.0.1:8000

  docker:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Construir la imagen
        run: docker build -t hr-assistant .
